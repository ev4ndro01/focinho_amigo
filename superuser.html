<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do SuperUsuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/superuser.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-user-shield me-2"></i>
                Painel do SuperUsuário
            </a>
            <a href="index.html" class="btn btn-outline-light">Sair</a>
        </div>
    </nav>

    <div class="container mt-4">
        <ul class="nav nav-tabs" id="userTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="adotantes-tab" data-bs-toggle="tab" data-bs-target="#adotantes"
                    type="button" role="tab">Adotantes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="ongs-tab" data-bs-toggle="tab" data-bs-target="#ongs" type="button"
                    role="tab">ONGs</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="veterinarios-tab" data-bs-toggle="tab" data-bs-target="#veterinarios"
                    type="button" role="tab">Veterinários</button>
            </li>
        </ul>

        <div class="tab-content" id="userTabsContent">
            <div class="tab-pane fade show active" id="adotantes" role="tabpanel">
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>CPF</th>
                                <th>Nascimento</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="adotantes-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="ongs" role="tabpanel">
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>CNPJ</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="ongs-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="veterinarios" role="tabpanel">
                <div class="table-responsive mt-3">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>CRMV</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="veterinarios-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Editar Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editUserForm"></form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" form="editUserForm">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/superuser.js" type="module"></script>
</body>

</html>
